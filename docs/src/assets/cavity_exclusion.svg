<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Three-panel diagram: a ring of atoms with a sealed central cavity has exposed dots on both its outer surface and its inner cavity wall; connecting dots within a cutoff distance forms two disconnected rings, since the gap between them is wider than the cutoff; only the ring reachable from a seeded extreme dot is kept, the other is cleared.">
  <defs>
    <marker id="cavex-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1C2022"></path>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"></rect>

  <!-- ============ PANEL 1 : exposed dots, undifferentiated ============ -->
  <text x="160" y="34" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#1C2022">1. Exposed dots (pairwise test)</text>
  <g transform="translate(30,50)" fill="none">
    <g stroke="#1C2022" stroke-opacity="0.4" fill="#1C2022" fill-opacity="0.06">
      <circle cx="185" cy="130" r="34"></circle>
      <circle cx="169" cy="169" r="34"></circle>
      <circle cx="130" cy="185" r="34"></circle>
      <circle cx="91"  cy="169" r="34"></circle>
      <circle cx="75"  cy="130" r="34"></circle>
      <circle cx="91"  cy="91"  r="34"></circle>
      <circle cx="130" cy="75"  r="34"></circle>
      <circle cx="169" cy="91"  r="34"></circle>
    </g>
    <g fill="#1C2022">
      <circle cx="216" cy="130" r="5"></circle>
      <circle cx="209" cy="163" r="5"></circle>
      <circle cx="191" cy="191" r="5"></circle>
      <circle cx="163" cy="209" r="5"></circle>
      <circle cx="130" cy="216" r="5"></circle>
      <circle cx="97"  cy="209" r="5"></circle>
      <circle cx="69"  cy="191" r="5"></circle>
      <circle cx="51"  cy="163" r="5"></circle>
      <circle cx="44"  cy="130" r="5"></circle>
      <circle cx="51"  cy="97"  r="5"></circle>
      <circle cx="69"  cy="69"  r="5"></circle>
      <circle cx="97"  cy="51"  r="5"></circle>
      <circle cx="130" cy="44"  r="5"></circle>
      <circle cx="163" cy="51"  r="5"></circle>
      <circle cx="191" cy="69"  r="5"></circle>
      <circle cx="209" cy="97"  r="5"></circle>

      <circle cx="156" cy="130" r="5"></circle>
      <circle cx="151" cy="145" r="5"></circle>
      <circle cx="138" cy="155" r="5"></circle>
      <circle cx="122" cy="155" r="5"></circle>
      <circle cx="109" cy="145" r="5"></circle>
      <circle cx="104" cy="130" r="5"></circle>
      <circle cx="109" cy="115" r="5"></circle>
      <circle cx="122" cy="105" r="5"></circle>
      <circle cx="138" cy="105" r="5"></circle>
      <circle cx="151" cy="115" r="5"></circle>
    </g>
  </g>
  <text font-family="monospace" font-size="12.5" fill="#1C2022" fill-opacity="0.75">
    <tspan x="20" y="332">Both rings of dots passed the atom-</tspan>
    <tspan x="20" y="349">atom occlusion test. Nothing here</tspan>
    <tspan x="20" y="366">yet marks the inner ring as a sealed</tspan>
    <tspan x="20" y="383">interior pocket rather than surface.</tspan>
  </text>

  <line x1="298" y1="180" x2="358" y2="180" stroke="#1C2022" stroke-width="1.6" marker-end="url(#cavex-arrow)"></line>
  <text x="328" y="170" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1C2022" fill-opacity="0.75">union&#8211;find</text>

  <!-- ============ PANEL 2 : build adjacency graph + seeds ============ -->
  <text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#1C2022">2. Connect dots &#8804; cutoff apart</text>
  <g transform="translate(370,50)" fill="none">
    <g stroke="#1C2022" stroke-opacity="0.25" fill="#1C2022" fill-opacity="0.05">
      <circle cx="185" cy="130" r="34"></circle>
      <circle cx="169" cy="169" r="34"></circle>
      <circle cx="130" cy="185" r="34"></circle>
      <circle cx="91"  cy="169" r="34"></circle>
      <circle cx="75"  cy="130" r="34"></circle>
      <circle cx="91"  cy="91"  r="34"></circle>
      <circle cx="130" cy="75"  r="34"></circle>
      <circle cx="169" cy="91"  r="34"></circle>
    </g>
    <g stroke="#1C2022" stroke-opacity="0.55" stroke-width="1.5">
      <line x1="216" y1="130" x2="209" y2="163"></line>
      <line x1="209" y1="163" x2="191" y2="191"></line>
      <line x1="191" y1="191" x2="163" y2="209"></line>
      <line x1="163" y1="209" x2="130" y2="216"></line>
      <line x1="130" y1="216" x2="97"  y2="209"></line>
      <line x1="97"  y1="209" x2="69"  y2="191"></line>
      <line x1="69"  y1="191" x2="51"  y2="163"></line>
      <line x1="51"  y1="163" x2="44"  y2="130"></line>
      <line x1="44"  y1="130" x2="51"  y2="97"></line>
      <line x1="51"  y1="97"  x2="69"  y2="69"></line>
      <line x1="69"  y1="69"  x2="97"  y2="51"></line>
      <line x1="97"  y1="51"  x2="130" y2="44"></line>
      <line x1="130" y1="44"  x2="163" y2="51"></line>
      <line x1="163" y1="51"  x2="191" y2="69"></line>
      <line x1="191" y1="69"  x2="209" y2="97"></line>
      <line x1="209" y1="97"  x2="216" y2="130"></line>
    </g>
    <g stroke="#1C2022" stroke-opacity="0.55" stroke-width="1.5">
      <line x1="156" y1="130" x2="151" y2="145"></line>
      <line x1="151" y1="145" x2="138" y2="155"></line>
      <line x1="138" y1="155" x2="122" y2="155"></line>
      <line x1="122" y1="155" x2="109" y2="145"></line>
      <line x1="109" y1="145" x2="104" y2="130"></line>
      <line x1="104" y1="130" x2="109" y2="115"></line>
      <line x1="109" y1="115" x2="122" y2="105"></line>
      <line x1="122" y1="105" x2="138" y2="105"></line>
      <line x1="138" y1="105" x2="151" y2="115"></line>
      <line x1="151" y1="115" x2="156" y2="130"></line>
    </g>
    <line x1="216" y1="130" x2="156" y2="130" stroke="#1C2022" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="3 4"></line>
    <g stroke="#1C2022" stroke-opacity="0.8" stroke-width="1.6">
      <line x1="182" y1="124" x2="190" y2="136"></line>
      <line x1="190" y1="124" x2="182" y2="136"></line>
    </g>
    <text x="186" y="112" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1C2022" fill-opacity="0.8">gap &gt; cutoff</text>

    <g fill="#1C2022">
      <circle cx="209" cy="163" r="5"></circle>
      <circle cx="191" cy="191" r="5"></circle>
      <circle cx="163" cy="209" r="5"></circle>
      <circle cx="97"  cy="209" r="5"></circle>
      <circle cx="69"  cy="191" r="5"></circle>
      <circle cx="51"  cy="163" r="5"></circle>
      <circle cx="51"  cy="97"  r="5"></circle>
      <circle cx="69"  cy="69"  r="5"></circle>
      <circle cx="97"  cy="51"  r="5"></circle>
      <circle cx="163" cy="51"  r="5"></circle>
      <circle cx="191" cy="69"  r="5"></circle>
      <circle cx="209" cy="97"  r="5"></circle>

      <circle cx="156" cy="130" r="5"></circle>
      <circle cx="151" cy="145" r="5"></circle>
      <circle cx="138" cy="155" r="5"></circle>
      <circle cx="122" cy="155" r="5"></circle>
      <circle cx="109" cy="145" r="5"></circle>
      <circle cx="104" cy="130" r="5"></circle>
      <circle cx="109" cy="115" r="5"></circle>
      <circle cx="122" cy="105" r="5"></circle>
      <circle cx="138" cy="105" r="5"></circle>
      <circle cx="151" cy="115" r="5"></circle>
    </g>
    <g fill="#1C2022">
      <circle cx="216" cy="130" r="5"></circle>
      <circle cx="130" cy="216" r="5"></circle>
      <circle cx="44"  cy="130" r="5"></circle>
      <circle cx="130" cy="44"  r="5"></circle>
    </g>
    <g fill="none" stroke="#1C2022" stroke-width="1.3">
      <circle cx="216" cy="130" r="9"></circle>
      <circle cx="130" cy="216" r="9"></circle>
      <circle cx="44"  cy="130" r="9"></circle>
      <circle cx="130" cy="44"  r="9"></circle>
    </g>
    <text x="228" y="134" font-family="monospace" font-size="10.5" fill="#1C2022" fill-opacity="0.85">seed</text>
  </g>
  <text font-family="monospace" font-size="12.5" fill="#1C2022" fill-opacity="0.75">
    <tspan x="360" y="332">Chaining nearby dots rebuilds the</tspan>
    <tspan x="360" y="349">surface's real adjacency. The outer</tspan>
    <tspan x="360" y="366">ring closes on itself; so does the</tspan>
    <tspan x="360" y="383">inner one &#8212; nothing bridges the gap.</tspan>
  </text>

  <line x1="638" y1="180" x2="698" y2="180" stroke="#1C2022" stroke-width="1.6" marker-end="url(#cavex-arrow)"></line>
  <text x="668" y="170" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1C2022" fill-opacity="0.75">does root reach a seed?</text>

  <!-- ============ PANEL 3 : keep seeded component, drop the rest ============ -->
  <text x="840" y="34" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#1C2022">3. Keep seeded component, drop rest</text>
  <g transform="translate(710,50)" fill="none">
    <g stroke="#1C2022" stroke-opacity="0.2" fill="#1C2022" fill-opacity="0.04">
      <circle cx="185" cy="130" r="34"></circle>
      <circle cx="169" cy="169" r="34"></circle>
      <circle cx="130" cy="185" r="34"></circle>
      <circle cx="91"  cy="169" r="34"></circle>
      <circle cx="75"  cy="130" r="34"></circle>
      <circle cx="91"  cy="91"  r="34"></circle>
      <circle cx="130" cy="75"  r="34"></circle>
      <circle cx="169" cy="91"  r="34"></circle>
    </g>
    <g fill="#136F58">
      <circle cx="216" cy="130" r="5.5"></circle>
      <circle cx="209" cy="163" r="5.5"></circle>
      <circle cx="191" cy="191" r="5.5"></circle>
      <circle cx="163" cy="209" r="5.5"></circle>
      <circle cx="130" cy="216" r="5.5"></circle>
      <circle cx="97"  cy="209" r="5.5"></circle>
      <circle cx="69"  cy="191" r="5.5"></circle>
      <circle cx="51"  cy="163" r="5.5"></circle>
      <circle cx="44"  cy="130" r="5.5"></circle>
      <circle cx="51"  cy="97"  r="5.5"></circle>
      <circle cx="69"  cy="69"  r="5.5"></circle>
      <circle cx="97"  cy="51"  r="5.5"></circle>
      <circle cx="130" cy="44"  r="5.5"></circle>
      <circle cx="163" cy="51"  r="5.5"></circle>
      <circle cx="191" cy="69"  r="5.5"></circle>
      <circle cx="209" cy="97"  r="5.5"></circle>
    </g>
    <g stroke="#AE4B24" stroke-width="1.6" fill="#ffffff">
      <circle cx="156" cy="130" r="5"></circle>
      <circle cx="151" cy="145" r="5"></circle>
      <circle cx="138" cy="155" r="5"></circle>
      <circle cx="122" cy="155" r="5"></circle>
      <circle cx="109" cy="145" r="5"></circle>
      <circle cx="104" cy="130" r="5"></circle>
      <circle cx="109" cy="115" r="5"></circle>
      <circle cx="122" cy="105" r="5"></circle>
      <circle cx="138" cy="105" r="5"></circle>
      <circle cx="151" cy="115" r="5"></circle>
    </g>
  </g>
  <text font-family="monospace" font-size="12.5" fill="#1C2022" fill-opacity="0.75">
    <tspan x="700" y="332">Only the component holding a seed</tspan>
    <tspan x="700" y="349">is real exterior. The pocket's dots</tspan>
    <tspan x="700" y="366">never reach one, so exposed is set</tspan>
    <tspan x="700" y="383">to false for every one of them.</tspan>
  </text>

  <!-- ============ legend ============ -->
  <g font-family="monospace" font-size="12" fill="#1C2022" fill-opacity="0.8">
    <circle cx="30" cy="430" r="5" fill="#1C2022"></circle>
    <circle cx="30" cy="430" r="9" fill="none" stroke="#1C2022" stroke-width="1.3"></circle>
    <text x="46" y="434">extreme dot (seed)</text>

    <line x1="280" y1="430" x2="310" y2="430" stroke="#1C2022" stroke-width="1.5"></line>
    <text x="318" y="434">edge &#8804; cavity_dot_cutoff</text>

    <circle cx="560" cy="430" r="5.5" fill="#136F58"></circle>
    <text x="574" y="434">kept (reaches a seed)</text>

    <circle cx="800" cy="430" r="5" stroke="#AE4B24" stroke-width="1.6" fill="#ffffff"></circle>
    <text x="814" y="434">excluded (sealed cavity)</text>
  </g>
</svg>
