# Test files, from https://github.com/m3g/MolSimTestFiles (downloaded only when needed).
#
# The pdbtools set is also used by PDBToolsBase.jl. It is referenced here, and not obtained
# from PDBToolsBase.test_file, such that the tests of PDBTools do not depend on the version
# of PDBToolsBase. Artifacts are stored by content hash, so if both packages use the same 
# version of the set, it is downloaded only once.
[pdbtools_test_files]
git-tree-sha1 = "541eb7a321acaa5ef054b2f9c8acdcd7d38c65be"
lazy = true

    [[pdbtools_test_files.download]]
    url = "https://github.com/m3g/MolSimTestFiles/releases/download/pdbtools-v3/pdbtools.tar.gz"
    sha256 = "a5287322e4e881c37446b7502494359d69ad8327723751fd534413d8c483cbf9"

