name: Doc Preview Cleanup

# Removes the documentation preview of a pull request (previews/PR<number>, deployed
# by docs/make.jl with push_preview = true) from the gh-pages branch when the pull
# request is closed (merged or not).
on:
  pull_request:
    types: [closed]

# Only one cleanup pushes to gh-pages at a time
concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Delete preview and push changes
        run: |
          if [ -d "${preview_dir}" ]; then
              git config user.name "Documenter.jl"
              git config user.email "documenter@juliadocs.github.io"
              git rm -rf "${preview_dir}"
              git commit -m "delete preview ${preview_dir}"
              git push origin gh-pages
          fi
        env:
          preview_dir: previews/PR${{ github.event.number }}
